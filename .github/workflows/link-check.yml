name: リンク切れチェック
on:
  schedule:
    - cron: '0 21 * * 0'
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
      - name: リンク切れをチェック
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --exclude 'instagram\.com' './**/*.html'
          fail: true
      - name: 問題があればIssueを自動作成
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: 🔗 リンク切れが見つかりました
          content-filepath: ./lychee/out.md
          labels: link-check, 自動チェック
